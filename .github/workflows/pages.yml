# Publishes web/ (the app + its JSON snapshot) to GitHub Pages on every push to main.
# The site is static: it shows the precomputed snapshot. Live research runs via `python -m finn serve`.
name: Deploy app

on:
  push:
    branches: [main]
    paths: ["web/**", "scripts/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Keep the newer of the repo's data and the published (scheduled-refresh) data.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/snapshot.py restore https://animeshdubey6472.github.io/finn/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
